# Included in every proxied location: a location that sets any proxy_set_header of its own
# drops all of the server-level ones (doc 02, F10).
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto $fwd_proto;
proxy_set_header X-Forwarded-For $client_key;
proxy_set_header X-Real-IP $client_key;
