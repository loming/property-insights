# The single published entry point (doc 03 §4.5). The Host header picks the set (brief or Ridge);
# the path prefix picks the service. Upstreams are variables that Docker's DNS resolves per request,
# so the gateway starts without the ridge profile and follows recreated containers (doc 02, F10).
resolver 127.0.0.11 valid=10s ipv6=off;

# Behind cloudflared every request arrives from the same Docker address, so limits and logs use the
# visitor's IP. The header is trusted only because the port is published on 127.0.0.1.
map $http_cf_connecting_ip $client_key {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}
map $http_x_forwarded_proto $fwd_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

map $host $variant {
    default                 brief;
    hsbc-ridge.loming.com   ridge;
    ridge.localhost         ridge;
}
map $variant $ml_api_upstream {
    brief   ml-api:8000;
    ridge   ml-api-ridge:8000;
}
map $variant $estimator_api_upstream {
    brief   estimator-api:8001;
    ridge   estimator-api-ridge:8001;
}
map $variant $market_api_upstream {
    brief   market-api:8080;
    ridge   market-api-ridge:8080;
}
map $variant $portal_upstream {
    brief   portal:3000;
    ridge   portal-ridge:3000;
}

# Clearing the whole history isn't exposed publicly: anyone could wipe the demo. The portal calls
# estimator-api over the compose network, so it isn't affected; single deletes still pass.
map "$request_method $uri" $blocked_publicly {
    "DELETE /estimator-api/api/v1/estimates"    1;
    "DELETE /estimator-api/api/v1/estimates/"   1;
    default                                     0;
}

# Per visitor, across all API prefixes. The burst covers a Swagger UI page load (about 10 files through
# /market-api/) plus quick clicking; a flood is held to 10 requests a second.
limit_req_zone $client_key zone=api:10m rate=10r/s;
# Pages: a navigation fetches the page plus RSC payloads and prefetches; static assets aren't counted.
limit_req_zone $client_key zone=web:10m rate=20r/s;
limit_req_status 429;

log_format gateway '$client_key [$time_local] $host "$request" $status $body_bytes_sent '
                   '$request_time "$http_user_agent"';
access_log /dev/stdout gateway;

server {
    listen 8080 default_server;
    server_tokens off;
    client_max_body_size 1m;
    # Relative Location headers: absolute ones would leak http:// and the container port.
    absolute_redirect off;

    location = /gateway-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Task 1: the model API and its Swagger UI.
    location = /ml-api {
        return 301 /ml-api/docs;
    }
    location /ml-api/ {
        limit_req zone=api burst=40 nodelay;
        include /etc/nginx/snippets/proxy_headers.conf;
        proxy_set_header X-Forwarded-Prefix /ml-api;
        rewrite ^/ml-api(/.*)$ $1 break;
        proxy_pass http://$ml_api_upstream;
    }

    # Task 2, App 1's backend and its Swagger UI.
    location = /estimator-api {
        return 301 /estimator-api/docs;
    }
    location /estimator-api/ {
        if ($blocked_publicly) {
            return 403;
        }
        limit_req zone=api burst=40 nodelay;
        include /etc/nginx/snippets/proxy_headers.conf;
        proxy_set_header X-Forwarded-Prefix /estimator-api;
        rewrite ^/estimator-api(/.*)$ $1 break;
        proxy_pass http://$estimator_api_upstream;
    }

    # Task 2, App 2's backend, its Swagger UI and its Actuator. Spring honours X-Forwarded-Prefix
    # (server.forward-headers-strategy=framework), so its redirects and server URLs keep /market-api.
    location = /market-api {
        return 301 /market-api/swagger-ui.html;
    }
    location /market-api/ {
        limit_req zone=api burst=40 nodelay;
        include /etc/nginx/snippets/proxy_headers.conf;
        proxy_set_header X-Forwarded-Prefix /market-api;
        rewrite ^/market-api(/.*)$ $1 break;
        proxy_pass http://$market_api_upstream;
    }

    # Task 2: the portal. Fingerprinted static assets are cached by browsers and not rate-limited.
    location /_next/static/ {
        include /etc/nginx/snippets/proxy_headers.conf;
        proxy_pass http://$portal_upstream;
    }
    location / {
        limit_req zone=web burst=60 nodelay;
        include /etc/nginx/snippets/proxy_headers.conf;
        # Pass streamed HTML and Suspense chunks through as they're produced (doc 02, E16).
        proxy_buffering off;
        proxy_pass http://$portal_upstream;
        error_page 502 503 504 = @portal_unavailable;
    }

    location @portal_unavailable {
        default_type text/html;
        add_header Retry-After 10 always;
        return 503 '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Starting up · Property Insights</title></head><body style="font-family:system-ui,sans-serif;max-width:36rem;margin:3rem auto;padding:0 1rem"><main><h1>Starting up</h1><p>The $variant set of the portal is not running right now. Try again in a minute.</p></main></body></html>';
    }

    error_page 403 = @forbidden;
    error_page 413 = @too_large;
    error_page 429 = @rate_limited;
    error_page 502 503 504 = @unavailable;

    location @forbidden {
        default_type application/problem+json;
        return 403 '{"type":"forbidden","title":"Forbidden","status":403,"detail":"Clearing the whole history is not available through the public gateway; delete estimates one at a time"}';
    }
    location @too_large {
        default_type application/problem+json;
        return 413 '{"type":"content-too-large","title":"Content Too Large","status":413,"detail":"The request body is larger than 1 MB"}';
    }
    location @rate_limited {
        default_type application/problem+json;
        add_header Retry-After 1 always;
        return 429 '{"type":"rate-limited","title":"Too Many Requests","status":429,"detail":"Slow down: at most 10 requests a second, with short bursts"}';
    }
    location @unavailable {
        default_type application/problem+json;
        return 503 '{"type":"service-unavailable","title":"Service Unavailable","status":503,"detail":"The $variant set of this service is not running"}';
    }
}
