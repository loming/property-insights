[project]
name = "ml-api"
version = "1.0.0"
description = "Task 1: a house-price regression model behind a FastAPI service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "joblib>=1.6.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pydantic-settings>=2.16.2",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"

[tool.uv]
# Pinned in three places: here, the Dockerfile and CI (doc 02, A4).
required-version = "==0.11.28"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
