name: property-insights

# The brief set runs by default. `--profile ridge` (or COMPOSE_PROFILES=ridge in .env) adds the
# Ridge set: the same images, with ml-api trained as Ridge. Only the gateway publishes a port.

services:
  ml-api:
    build:
      context: ./ml-api
      additional_contexts:
        data: ./data
      args:
        MODEL_KIND: ols
    image: property-insights/ml-api:ols
    environment:
      # The gateway serves this service under /ml-api/ and strips the prefix.
      UVICORN_ROOT_PATH: /ml-api
      LOG_LEVEL: INFO
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  ml-api-ridge:
    extends: ml-api
    profiles: [ridge]
    build:
      args:
        MODEL_KIND: ridge
    image: property-insights/ml-api:ridge

  estimator-api:
    build: ./estimator-api
    image: property-insights/estimator-api:local
    environment:
      UVICORN_ROOT_PATH: /estimator-api
      ML_API_URL: http://ml-api:8000
      LOG_LEVEL: INFO
    volumes:
      - estimator-data:/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  estimator-api-ridge:
    extends: estimator-api
    profiles: [ridge]
    environment:
      ML_API_URL: http://ml-api-ridge:8000
    # Same mount point, own volume: the two sets keep separate histories.
    volumes:
      - estimator-ridge-data:/data

  market-api:
    build:
      context: ./market-api
      additional_contexts:
        data: ./data
    image: property-insights/market-api:local
    environment:
      MARKET_ML_API_URL: http://ml-api:8000
    # The JVM sizes its heap from this (MaxRAMPercentage=75).
    mem_limit: 768m
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  market-api-ridge:
    extends: market-api
    profiles: [ridge]
    environment:
      MARKET_ML_API_URL: http://ml-api-ridge:8000

  portal:
    build: ./portal
    image: property-insights/portal:local
    environment:
      # Server-side calls go straight to the backends over this network, never through the gateway.
      ESTIMATOR_API_URL: http://estimator-api:8001
      MARKET_API_URL: http://market-api:8080
      APP_VARIANT: brief
      OTHER_VARIANT_URL: ${RIDGE_PUBLIC_URL:-http://ridge.localhost:8130}
    read_only: true
    tmpfs:
      - /tmp
      # Next's fetch cache, writable by the node user (uid 1000).
      - /app/.next/cache:uid=1000,gid=1000
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  portal-ridge:
    extends: portal
    profiles: [ridge]
    environment:
      ESTIMATOR_API_URL: http://estimator-api-ridge:8001
      MARKET_API_URL: http://market-api-ridge:8080
      APP_VARIANT: ridge
      OTHER_VARIANT_URL: ${BRIEF_PUBLIC_URL:-http://localhost:8130}

  gateway:
    image: nginxinc/nginx-unprivileged:1.30.6-alpine
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8130}:8080"
    volumes:
      - ./gateway/conf.d:/etc/nginx/conf.d:ro
      - ./gateway/snippets:/etc/nginx/snippets:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/gateway-health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  estimator-data:
  estimator-ridge-data:
